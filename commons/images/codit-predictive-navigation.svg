<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Predictive navigation controller comparison</title>
  <desc id="desc">A mobile robot with dashed predicted paths leads to two ways to score actions: an objective rollout and a learned Q-value. Conceptual illustration, not trial data.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#38586e" stroke-opacity=".35"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1l6 3.5L1 8" fill="none" stroke="#67d8e9" stroke-width="1.5"/>
    </marker>
  </defs>
  <path fill="#102235" d="M0 0h1200v630H0z"/>
  <rect x="86" y="86" width="1028" height="458" rx="30" fill="#152c42" stroke="#38586e" stroke-width="2"/>
  <rect x="112" y="112" width="976" height="406" rx="18" fill="url(#grid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M354 324c85-1 141-27 183-118m-183 118c117 1 164-13 205-12m-205 12c85 1 142 31 184 101" stroke="#67d8e9" stroke-width="5" stroke-dasharray="6 13"/>
    <path d="M562 205h42m-42 221h42" stroke="#67d8e9" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(298 324)">
    <circle r="75" fill="#102235" stroke="#38586e" stroke-width="2"/>
    <rect x="-52" y="-41" width="104" height="82" rx="30" fill="#25485b" stroke="#67d8e9" stroke-width="5"/>
    <path d="M-21-45h34m-34 90h34" stroke="#eef7fb" stroke-width="12" stroke-linecap="round"/>
    <path d="M-9-14l23 14-23 14z" fill="#67d8e9"/>
  </g>
  <g font-family="system-ui, sans-serif" font-weight="650" text-anchor="middle" fill="#eef7fb">
    <text x="333" y="468" font-size="29">Predicted paths</text>
    <rect x="630" y="137" width="347" height="144" rx="18" fill="#102235" stroke="#38586e" stroke-width="2"/>
    <text x="803" y="194" font-size="31">Objective rollout</text>
    <path d="M732 231h144" stroke="#e4b97a" stroke-width="3"/>
    <g fill="#102235" stroke="#e4b97a" stroke-width="4">
      <circle cx="732" cy="231" r="7"/>
      <circle cx="780" cy="231" r="7"/>
      <circle cx="828" cy="231" r="7"/>
      <circle cx="876" cy="231" r="7"/>
    </g>
    <rect x="630" y="349" width="347" height="144" rx="18" fill="#102235" stroke="#38586e" stroke-width="2"/>
    <text x="803" y="406" font-size="31">Learned Q-value</text>
    <rect x="773" y="424" width="60" height="48" rx="9" fill="#25485b" stroke="#67d8e9" stroke-width="3"/>
    <text x="803" y="458" fill="#67d8e9" font-size="27">Q</text>
  </g>
</svg>
