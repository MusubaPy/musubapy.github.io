<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open-chain and closed-chain robot hoppers</title>
  <desc id="desc">Conceptual drawings compare a serial leg using impedance control with a closed-loop leg using an elastic linkage. The arrows indicate controlled joints and the zigzag indicates a spring.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 36V0h36" fill="none" stroke="#67d8e9" opacity=".08"/>
    </pattern>
    <linearGradient id="shade" x2="0" y2="1">
      <stop stop-color="#19364b"/>
      <stop offset="1" stop-color="#102235"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M600 120v354" fill="none" stroke="#67d8e9" stroke-opacity=".25" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#eef7fb">
    <g font-size="36" font-weight="650">
      <text x="400" y="149">Open chain</text>
      <text x="800" y="149">Closed chain</text>
    </g>
    <g font-size="29" fill="#f6bf73">
      <text x="400" y="195">Impedance control</text>
      <text x="800" y="195">Mechanical compliance</text>
    </g>
  </g>
